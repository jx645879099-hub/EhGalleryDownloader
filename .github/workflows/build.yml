name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\EhGalleryDownloader.sln

      - name: Build
        run: dotnet build .\EhGalleryDownloader.sln -c Release --no-restore

      - name: Run offline integration checks
        run: dotnet run --project .\tests\EhGalleryDownloader.IntegrationProbe\EhGalleryDownloader.IntegrationProbe.csproj -c Release --no-build -- --unit-only

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check browser extension syntax
        run: node --check .\src\EhGalleryDownloader\BrowserExtension\popup.js

      - name: Test browser extension
        run: node --input-type=module -e "import('./tests/browser-extension/popup.test.mjs').then(async module => console.log((await module.runExtensionTests()).join('\n')))"
